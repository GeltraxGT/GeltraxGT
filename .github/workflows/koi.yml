# Two koi flank the whale: gold on the left, asagi on the right.
# The git-koi Action downloads into a shared temp dir, so two uses in one
# job collide -- the two fish run as sequential jobs instead.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi show the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi-left:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi-left
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi-left/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's left koi"
          git fetch --quiet origin main
          git rebase --quiet origin/main
          git push --quiet

  koi-right:
    needs: koi-left
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: asagi
          output-dir: koi-right
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi-right/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's right koi"
          git fetch --quiet origin main
          git rebase --quiet origin/main
          git push --quiet
